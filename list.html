<!-- A page where you can use CRUD to change a shopping list -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PP - Settings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/list.css">
    <link rel="icon" href="https://fav.farm/%F0%9F%A5%A9">
</head>

<!-- Navbar to navigate through pages -->

<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Protein Pantry</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarTogglerDemo02"
                aria-controls="navbarTogglerDemo02" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarTogglerDemo02">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="search.html">Search</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="history.html">History</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="#">Shopping List</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="donate.html">Donate</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <main>
        <h1 class="text-center">Your Shopping List</h1>
        <!-- Add things to the list here -->
        <div class="card">
            <div class="card-body">
                <form id="list-form" class="d-flex">
                    <input class="form-control me-2" id="list-input" type="search" placeholder="Add to your list..."
                        aria-label="Search">
                    <button class="btn btn-outline-success" type="submit">Add</button>
                </form>
            </div>
        </div>
        <ol id="shopping-list" class="grid-container">
            <!-- This is where items will be added, remove and changed in the list -->
        </ol>
        <!-- Clear the list here -->
        <div class="card text-center" id="bottom">
            <div class="card-footer text-body-secondary">
                <button type="button" class="btn btn-danger" id="clear-list">Clear List</button>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="scripts/list.js"></script>
</body>

</html>
